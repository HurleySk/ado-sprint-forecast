[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sprint-forecast"
version = "0.1.0"
description = "Forecast how much of an Azure DevOps sprint's day-1 committed scope will be delivered"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Samuel Hurley"}]
keywords = ["azure-devops", "forecasting", "sprint", "lightgbm", "monte-carlo"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click>=8.1",
    "joblib>=1.3",
    "lightgbm>=4.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "scipy>=1.11",
]

[project.urls]
Homepage = "https://github.com/HurleySk/ado-sprint-forecast"
Repository = "https://github.com/HurleySk/ado-sprint-forecast"
Issues = "https://github.com/HurleySk/ado-sprint-forecast/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
sprint-forecast = "sprint_forecast.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
